{stage:4,id:'footageReview',critical:true,when:c=>op(c)&&c.info.sensitive==='yes',ref:'10(ب)',ar:'عند القرب من مواقع حساسة، هل توجد ترتيبات لمراجعة التسجيلات المصورة؟',en:'Near sensitive locations, are arrangements in place for review of recorded footage?',har:'تذكر المادة مراجعة التسجيلات في حال وجود أماكن حساسة قريبة.',hen:'The text refers to review of recordings when sensitive locations are nearby.'},
{stage:4,id:'limits',critical:true,when:op,ref:'7(أ)(2)',ar:'هل مكان التحليق وارتفاعه ومساره ووقته محصورة ضمن الحدود المصرح بها؟',en:'Will every flight remain within its approved area, altitude, route and time?',har:'تجاوز أي من هذه القيود قد يؤدي إلى وقف الرخصة أو إلغائها أو سحبها.',hen:'Exceeding these limits is cited as grounds for suspension, cancellation or withdrawal.'},

const keyValid=(obj,k)=>Object.prototype.hasOwnProperty.call(obj,k);
const defaults=()=>({lang:'ar',page:0,info:{entity:'',company:'',city:'',purposes:[],activities:['operate'],stage:'new',sensitive:'unsure',changed:'no',assurance:'undecided'},answers:{},created:new Date().toISOString()});
let state=defaults();try{const stored=JSON.parse(localStorage.getItem(STORAGE)||'null');if(stored&&stored.info&&stored.answers){const d=defaults();state={...d,...stored,info:{...d.info,...stored.info},answers:stored.answers};state.page=Math.min(5,Math.max(0,Number(state.page)||0));state.lang=state.lang==='en'?'en':'ar';if(!Array.isArray(state.info.purposes))state.info.purposes=[];if(!Array.isArray(state.info.activities))state.info.activities=['operate'];}}catch(e){}
const t=x=>x?.[state.lang]??x?.ar??'';
const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const el=id=>document.getElementById(id);
const applicable=()=>Q.filter(q=>q.when(state));
const answeredCount=()=>applicable().filter(q=>['yes','no','unsure'].includes(state.answers[q.id])).length;
const counts=()=>{const a=applicable();return {all:a.length,yes:a.filter(q=>state.answers[q.id]==='yes').length,no:a.filter(q=>state.answers[q.id]==='no').length,unsure:a.filter(q=>state.answers[q.id]==='unsure').length,blank:a.filter(q=>!['yes','no','unsure'].includes(state.answers[q.id])).length,major:a.filter(q=>q.critical&&state.answers[q.id]==='no').length}};
const save=()=>{try{localStorage.setItem(STORAGE,JSON.stringify(state));}catch(e){}};
const labelFor=(catalog,id)=>catalog.find(e=>e[0]===id)?.[1]||B(id,id);
const labels=(catalog,ids)=>ids.map(id=>t(labelFor(catalog,id))).join('، ');
const exWarnings=()=>{let r=[];if(['individual','unregistered'].includes(state.info.entity))r.push({severity:'no',critical:true,source:'2',title:t(UI.warningIndividual)});if(['otherPublic',''].includes(state.info.entity))r.push({severity:'unknown',source:'2',title:t(UI.warningUnknownEntity)});if(op(state)&&state.info.sensitive==='unsure')r.push({severity:'unknown',source:'10(ب)',title:t(UI.warningSensitive)});if(state.info.changed==='unsure'&&nonExempt(state))r.push({severity:'unknown',source:'8',title:state.lang==='ar'?'لم يتضح إن كان هناك تغيير في السجل التجاري أو تصرف بالرخصة يتطلب الموافقة.':'Unclear whether a commercial-register change or licence transfer requires approval.'});if(state.info.purposes.includes('other'))r.push({severity:'unknown',source:'4(ب)(2)',title:t(UI.warningOther)});if(nonExempt(state)&&state.info.assurance==='undecided')r.push({severity:'unknown',source:'5(أ)(2)',title:state.lang==='ar'?'لم يُحدّد بعد مسار الكفالة المالية أو التأمين المقبول.':'An approved guarantee or insurance pathway has not been selected.'});return r;};
function icon(type){if(type==='info')return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v1"/></svg>';if(type==='alert')return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M11 4.4 2.9 19a1.4 1.4 0 0 0 1.2 2h15.8a1.4 1.4 0 0 0 1.2-2L13 4.4a1.15 1.15 0 0 0-2 0Z"/><path d="M12 9v5m0 3v1"/></svg>';return ''}
function logo(){return `<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15h24M12 33h24M11 24h26"/><rect x="18" y="18" width="12" height="12" rx="3" fill="#c8def7"/><path d="M11 15 6 9m31 6 5-6M11 33l-5 6m31-6 5 6"/><circle cx="8" cy="9" r="4"/><circle cx="40" cy="9" r="4"/><circle cx="8" cy="39" r="4"/><circle cx="40" cy="39" r="4"/></svg>`}
function heroArt(){return `<svg viewBox="0 0 350 230" role="img" aria-label="drone" fill="none"><ellipse cx="180" cy="196" rx="122" ry="17" fill="#0c1d2f" opacity=".24"/><circle cx="170" cy="105" r="91" stroke="#8aaacf" opacity=".17"/><circle cx="170" cy="105" r="62" stroke="#8aaacf" stroke-dasharray="5 6" opacity=".27"/><path d="M88 90 160 116 245 90m-157 72 72-31 85 31" stroke="#bed5f3" stroke-width="11" stroke-linecap="round"/><path d="M88 90 160 116 245 90m-157 72 72-31 85 31" stroke="#3c638a" stroke-width="5" stroke-linecap="round"/><rect x="136" y="96" width="65" height="43" rx="16" fill="#d8e6f6"/><rect x="149" y="107" width="39" height="18" rx="8" fill="#3d678f"/><circle cx="170" cy="116" r="7" fill="#7ec4ec"/><path d="M150 139 139 158h-13m65-19 11 19h13" stroke="#e1efff" stroke-width="5" stroke-linecap="round"/><g fill="#87accf" stroke="#d7e9fb" stroke-width="3"><ellipse cx="88" cy="90" rx="32" ry="8"/><ellipse cx="245" cy="90" rx="32" ry="8"/><ellipse cx="88" cy="162" rx="32" ry="8"/><ellipse cx="245" cy="162" rx="32" ry="8"/></g><g fill="#dbeafb"><circle cx="88" cy="90" r="5"/><circle cx="245" cy="90" r="5"/><circle cx="88" cy="162" r="5"/><circle cx="245" cy="162" r="5"/></g><path d="M295 52h29v29M54 174H27v-29" stroke="#74a9d6" stroke-width="2" opacity=".5"/></svg>`}
function nav(){return `<div class="topbar no-print"><div class="shell navwrap"><div class="identity"><div class="brandmark">${logo()}</div><span>${t(UI.brand)}</span></div><div class="navtools"><a class="btn btn-sm top-link" target="_blank" rel="noopener noreferrer" href="${OFFICIAL}">${t(UI.topLink)} ↗</a><select class="language" data-field="lang" aria-label="Language"><option value="ar" ${state.lang==='ar'?'selected':''}>العربية</option><option value="en" ${state.lang==='en'?'selected':''}>English</option></select></div></div></div>`}
function hero(){return `<header class="hero no-print"><div class="shell hero-inner"><div><div class="eyebrow">${t(UI.heroTag)}</div><h1>${t(UI.heroTitle)}</h1><p>${t(UI.heroDesc)}</p><div class="hero-meta"><span class="hero-pill">${t(UI.heroPill1)}</span><span class="hero-pill">${t(UI.heroPill2)}</span><span class="hero-pill">${t(UI.heroPill3)}</span></div></div><div class="hero-art">${heroArt()}</div></div></header>`}
function sidenav(){const c=counts(),pct=c.all?Math.round(100*answeredCount()/c.all):0;return `<aside class="sidebar no-print"><div class="side-title">${t(UI.progress)}</div><div class="progress-number">${pct}%</div><div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div><div class="mini-stat">${answeredCount()} / ${c.all} ${t(UI.answered)}</div><nav class="steps" aria-label="assessment steps">${t(UI.steps).map((label,index)=>`<button type="button" class="step ${state.page===index?'active':''} ${state.page>index?'done':''}" data-action="goto" data-page="${index}"><span class="step-number">${index<5?String(index+1):'✓'}</span><span>${label}</span></button>`).join('')}</nav><div class="sidebar-bottom"><div>${t(UI.saveNote)}</div><div class="side-counts"><span class="side-count danger">${c.major} ${t(UI.critical)}</span><span class="side-count warn">${c.unsure+c.blank} ${t(UI.unknown)}</span></div></div></aside>`}
function sectionHead(){return `<div class="panel-head"><div class="section-kicker">${t(UI.sectionTag)} · ${state.page+1} / 6</div><h2>${t(UI.steps)[state.page]}</h2><p class="panel-subtitle">${t(UI.sectionDesc[state.page])}</p></div>`}
function selectOptions(items,value,placeholder){return (placeholder?`<option value="">${escapeHtml(placeholder)}</option>`:'')+items.map(([k,l])=>`<option value="${escapeHtml(k)}" ${value===k?'selected':''}>${escapeHtml(t(l))}</option>`).join('')}
function selectField(label,id,options,value,placeholder,help='',span=false){return `<div class="field-group ${span?'span':''}"><label class="field-label" for="${id}">${label}</label><select class="form-control" id="${id}" data-field="${id}">${selectOptions(options,value,placeholder)}</select>${help?`<div class="field-help">${help}</div>`:''}</div>`}
function textField(label,id,value,placeholder,span=false){return `<div class="field-group ${span?'span':''}"><label class="field-label" for="${id}">${label}</label><input class="form-control" type="text" id="${id}" data-field="${id}" maxlength="110" autocomplete="off" value="${escapeHtml(value)}" placeholder="${escapeHtml(placeholder)}"></div>`}
function chips(catalog,selected,group){return `<div class="chip-group">${catalog.map(([id,l])=>`<button type="button" class="chip ${selected.includes(id)?'selected':''}" data-action="toggleChip" data-group="${group}" data-id="${id}" aria-pressed="${selected.includes(id)}">${escapeHtml(t(l))}</button>`).join('')}</div>`}
function profile(){return `<div class="panel-body"><div class="intro-stripe">${icon('info')}<div>${t(UI.profileTip)}</div></div><div class="field-grid">${selectField(t(UI.fieldEntity),'entity',ENTITY,state.info.entity,t(UI.entityPlaceholder))}${selectField(t(UI.stage),'stage',STAGE,state.info.stage)}${textField(t(UI.org),'company',state.info.company,t(UI.orgPlaceholder))}${textField(t(UI.city),'city',state.info.city,t(UI.cityPlaceholder))}${selectField(t(UI.sensitive),'sensitive',SENS,state.info.sensitive)}${selectField(t(UI.changed),'changed',[['no',UI.companyChangesNone],['yes',UI.companyChangesYes],['unsure',UI.unsure]],state.info.changed)}<div class="field-group span field-highlight"><div class="field-label">${t(UI.purpose)}</div><div class="field-help">${t(UI.purposeHelp)}</div>${chips(PURPOSES,state.info.purposes,'purposes')}</div><div class="field-group span field-highlight"><div class="field-label">${t(UI.activities)}</div><div class="field-help">${t(UI.activitiesHelp)}</div>${chips(ACTIVITIES,state.info.activities,'activities')}</div></div><div id="profile-error" class="form-note">${t(UI.required)}</div></div>`}
function questionCard(q,n){let a=state.answers[q.id],cls=a==='yes'?'answered-yes':a==='no'?'answered-no':a==='unsure'?'answered-unknown':'';return `<section class="question ${cls}"><div class="q-head"><div class="q-number">${state.lang==='ar'?'المتطلب':'Requirement'} ${String(n+1).padStart(2,'0')}</div>${q.critical?`<span class="critical">${t(UI.priority)}</span>`:''}</div><div class="q-title">${escapeHtml(state.lang==='ar'?q.ar:q.en)}</div><div class="q-help">${escapeHtml(state.lang==='ar'?q.har:q.hen)}</div><div class="answers" role="group" aria-label="${escapeHtml(state.lang==='ar'?q.ar:q.en)}">${[['yes',UI.yes],['no',UI.no],['unsure',UI.unsure]].map(([val,label])=>`<button type="button" class="answer ${a===val?'sel-'+val:''}" aria-pressed="${a===val}" data-action="answer" data-id="${q.id}" data-value="${val}">${t(label)}</button>`).join('')}</div><div class="q-foot"><span class="article">${t(UI.article)} ${q.ref}</span></div></section>`}
function questionStage(){const qs=applicable().filter(q=>q.stage===state.page);return `<div class="panel-body"><div class="intro-stripe">${icon('info')}<div>${t(UI.questionIntro)}</div></div>${state.page===2&&nonExempt(state)?`<div class="field-highlight" style="margin-bottom:21px">${selectField(t(UI.insuranceChoice),'assurance',ASSURANCE,state.info.assurance)}<div class="field-help" style="margin-top:8px">${state.lang==='ar'?'المادة 5(أ)(2) تتيح كفالة مالية عدلية أو تغطية تأمينية وفقاً للشروط المحددة.':'Article 5(A)(2) provides for a financial guarantee or insurance under prescribed conditions.'}</div></div>`:''}<div class="question-list">${qs.length?qs.map(questionCard).join(''):`<div class="empty">${t(UI.emptyQuestions)}</div>`}</div></div>`}
function presentStatus(value){return value==='yes'?t(UI.met):value==='no'?t(UI.unmet):value==='unsure'?t(UI.needsReview):t(UI.notAnswered)}
function issueRow(row,type){let title='',txt='',ref='',critical=false;if(row.q){title=state.lang==='ar'?row.q.ar:row.q.en;txt=state.lang==='ar'?row.q.har:row.q.hen;ref=row.q.ref;critical=row.q.critical;}else{title=row.title;ref=row.source;critical=row.critical}return `<div class="issue ${type}"><div class="issue-mark">${type==='no'?'!':type==='review'?'?':'…'}</div><div class="issue-text"><strong>${escapeHtml(title)}</strong>${txt?`<span>${escapeHtml(txt)}</span>`:''}${critical&&type==='no'?`<span style="color:#a43a3a;font-weight:700">${t(UI.priority)}</span>`:''}</div><span class="issue-ref">${t(UI.article)} ${escapeHtml(ref)}</span></div>`}
function reportData(){const c=counts(),warnings=exWarnings(),issues=applicable().filter(q=>state.answers[q.id]==='no').map(q=>({q})),reviews=applicable().filter(q=>state.answers[q.id]==='unsure').map(q=>({q})),missing=applicable().filter(q=>!['yes','no','unsure'].includes(state.answers[q.id])).map(q=>({q}));for(const w of warnings){(w.severity==='no'?issues:reviews).push(w)}issues.sort((a,b)=>Number(Boolean(b.q?.critical||b.critical))-Number(Boolean(a.q?.critical||a.critical)));return {c,issues,reviews,missing,warnings}}
function report(){const d=reportData();const critical=d.issues.some(r=>r.q?.critical||r.critical);let verdict=critical?'fail':(d.issues.length||d.reviews.length||d.missing.length)?'partial':'pass';let title=critical?UI.blockedTitle:verdict==='partial'?UI.partialTitle:UI.passTitle;let desc=critical?UI.blockedDesc:verdict==='partial'?UI.partialDesc:UI.passDesc;if(exempt(state)&&!critical){verdict='partial';title=UI.exceptionTitle;desc=UI.exceptionDesc}const day=new Date().toLocaleString(state.lang==='ar'?'ar-JO':'en-GB',{dateStyle:'medium',timeStyle:'short'});return `<div class="panel-body"><div class="verdict ${verdict}"><div class="section-kicker">${t(UI.reportTitle)}</div><h3>${t(title)}</h3><p>${t(desc)}</p></div><div class="summary-row"><div class="metric good"><div class="num">${d.c.yes}</div><div class="desc">${t(UI.met)}</div></div><div class="metric bad"><div class="num">${d.c.no+d.warnings.filter(x=>x.severity==='no').length}</div><div class="desc">${t(UI.unmet)}</div></div><div class="metric uncertain"><div class="num">${d.c.unsure+d.warnings.filter(x=>x.severity!=='no').length}</div><div class="desc">${t(UI.needsReview)}</div></div><div class="metric missing"><div class="num">${d.c.blank}</div><div class="desc">${t(UI.notAnswered)}</div></div></div><div class="tiny">${t(UI.reportDate)}: ${escapeHtml(day)} · ${t(UI.reportOrg)}: ${escapeHtml(state.info.company||t(UI.noCompany))}</div><div class="tiny">${t(UI.reportScope)}: ${escapeHtml(labels(ACTIVITIES,state.info.activities))} · ${t(UI.reportPurpose)}: ${escapeHtml(labels(PURPOSES,state.info.purposes))}</div><div class="result-section"><h3>${t(UI.issuesTitle)} (${d.issues.length})</h3>${d.issues.length?d.issues.map(r=>issueRow(r,'no')).join(''):`<div class="empty">${t(UI.noIssues)}</div>`}</div><div class="result-section"><h3>${t(UI.reviewTitle)} (${d.reviews.length})</h3>${d.reviews.length?d.reviews.map(r=>issueRow(r,'review')).join(''):`<div class="tiny">${t(UI.noItems)}</div>`}</div><div class="result-section"><h3>${t(UI.pendingTitle)} (${d.missing.length})</h3>${d.missing.length?d.missing.map(r=>issueRow(r,'open')).join(''):`<div class="tiny">${t(UI.noItems)}</div>`}</div><div class="source-box"><strong>${t(UI.sourceHeading)}</strong><ul><li>${t(UI.source1)}</li><li>${t(UI.source2)}</li><li>${t(UI.source3)}</li><li><a href="${OFFICIAL}" target="_blank" rel="noopener noreferrer">${t(UI.official)} ↗</a> · <a href="${GUIDES}" target="_blank" rel="noopener noreferrer">${t(UI.guides)} ↗</a></li><li>${t(UI.reportNote)}</li></ul></div></div>`}
function actions(){const page=state.page;return `<div class="panel-actions no-print"><div class="button-row">${page>0?`<button class="btn" data-action="back">← ${t(UI.back)}</button>`:`<button class="btn btn-danger btn-sm" data-action="clear">${t(UI.restart)}</button>`}</div><div class="button-row end">${page===5?`<button class="btn btn-subtle" data-action="export">${t(UI.export)}</button><button class="btn btn-navy" data-action="print">${t(UI.print)}</button>`:page===4?`<button class="btn btn-primary" data-action="next">${t(UI.showReport)} ${state.lang==='ar'?'←':'→'}</button>`:`<button class="btn btn-primary" data-action="next">${t(UI.next)} ${state.lang==='ar'?'←':'→'}</button>`}</div></div>`}
function render(){document.documentElement.lang=state.lang;document.documentElement.dir=state.lang==='ar'?'rtl':'ltr';document.title=state.lang==='ar'?'مدقق الامتثال للطائرات المسيّرة | الأردن':'Jordan Drone Compliance Checker';const page=state.page;el('app').innerHTML=nav()+hero()+`<main class="shell"><div class="notice no-print">${icon('alert')}<span><strong>${state.lang==='ar'?'مهم: ':'Important: '}</strong>${t(UI.notice)}</span></div><div class="layout">${sidenav()}<section class="panel">${sectionHead()}${page===0?profile():page===5?report():questionStage()}${actions()}</section></div><footer class="footer no-print"><span>${t(UI.notLegal)}</span><span>CARC · ${t(UI.article)} 2–13 · 2025</span></footer></main>`;save()}
function profileValid(){return Boolean(state.info.entity&&state.info.purposes.length&&state.info.activities.length)}
function goto(p){if(p>0&&!profileValid()){state.page=0;render();const node=el('profile-error');if(node)node.classList.add('show');window.scrollTo({top:0,behavior:'smooth'});return}state.page=Math.min(5,Math.max(0,p));render();window.scrollTo({top:0,behavior:'smooth'})}
function reportExport(){const c=counts();const out={tool:'Jordan Drone Compliance Checker',basedOn:'Attached: Drone instructions 2025, 6 pages, Articles 2–13',versionNotice:'Header says 2025; attached Article 1 mentions 2024 and 2024-08-21',generatedAt:new Date().toISOString(),language:state.lang,applicant:{...state.info},summary:{...c,extraFlags:exWarnings()},assessment:applicable().map(q=>({id:q.id,article:q.ref,critical:q.critical,requirement:state.lang==='ar'?q.ar:q.en,answer:state.answers[q.id]||'unanswered',guidance:state.lang==='ar'?q.har:q.hen})),notice:'Self-assessment only. Does not constitute a licence, clearance or flight authorization.',officialSource:OFFICIAL};const b=new Blob([JSON.stringify(out,null,2)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(b);const a=document.createElement('a');a.href=url;a.download='jordan-drone-compliance-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000)}
el('app')||document.body.insertAdjacentHTML('afterbegin','<div id="app"></div>');
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const act=b.dataset.action;if(act==='answer'){state.answers[b.dataset.id]=b.dataset.value;render()}else if(act==='toggleChip'){const group=b.dataset.group,id=b.dataset.id,arr=state.info[group]||[];state.info[group]=arr.includes(id)?arr.filter(x=>x!==id):[...arr,id];render()}else if(act==='next')goto(state.page+1);else if(act==='back')goto(state.page-1);else if(act==='goto')goto(Number(b.dataset.page));else if(act==='export')reportExport();else if(act==='print'){state.page=5;render();window.print()}else if(act==='clear'){if(confirm(t(UI.resetConfirm))){state=defaults();render();window.scrollTo(0,0)}}});
document.addEventListener('change',e=>{const b=e.target.closest('[data-field]');if(!b)return;const fld=b.dataset.field;if(fld==='lang')state.lang=b.value==='en'?'en':'ar';else state.info[fld]=b.value;render()});
document.addEventListener('input',e=>{const b=e.target.closest('input[data-field]');if(!b)return;state.info[b.dataset.field]=b.value;save()});
render();
window.__droneCheckerTest={state:()=>state,counts,applicable:()=>applicable().map(q=>q.id),goto};
})();
</script>
</body>
